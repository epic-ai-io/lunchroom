[package]
name = "lunchroom"
description = "The lunchroom command and the Claude Code guard hook"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"
publish.workspace = true

[lints]
workspace = true

[features]
# The console (1.1): `lunchroom console` and `lunchroom install console`. Switched on in 1.1
# (spec §17 C2 item 1).
default = ["console"]
console = ["lunchroom-core/console"]

[dependencies]
crossterm = "=0.29.0"
ed25519-dalek = "=2.2.0"
lunchroom-core = { path = "../lunchroom-core" }
ratatui = "=0.30.2"
rustix = { version = "=1.1.4", features = ["termios", "fs", "pty", "process"] }
serde.workspace = true
serde_json.workspace = true
signal-hook = "=0.4.5"
toml_edit = { version = "0.25.17", default-features = false, features = ["parse", "display"] }
