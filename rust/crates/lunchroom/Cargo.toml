[package]
name = "lunchroom"
description = "The lunchroom command and the Claude Code guard hook"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"
publish.workspace = true

[lints]
workspace = true

[features]
# The console (1.1): `lunchroom console` and `lunchroom install console`. Built but switched off
# in 1.1.0; the release that includes the console builds with it on.
console = ["lunchroom-core/console"]

[dependencies]
lunchroom-core = { path = "../lunchroom-core" }
serde.workspace = true
serde_json.workspace = true
toml_edit = { version = "0.25.17", default-features = false, features = ["parse", "display"] }
