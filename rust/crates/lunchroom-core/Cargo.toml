[package]
name = "lunchroom-core"
description = "Lunchroom's decisions, vocabulary and stores, independent of any harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"
publish.workspace = true

[lints]
workspace = true

[features]
# The console's guard rules (1.1): terminals, process memory and environment, debuggers, kill,
# tmux and `ptrace`. On in 1.1 (spec §17 C2 item 1).
default = ["console"]
console = []

[dependencies]
rustix = { version = "=1.1.4", features = ["process", "thread"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
