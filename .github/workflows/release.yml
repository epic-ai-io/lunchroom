name: release
# A tag `v<version>` builds Lunchroom as a static program for Linux (x86_64 and aarch64), runs both programs on
# the Linux systems people use, and only then publishes the archives with SHA256SUMS signed by Sigstore
# (keyless, this workflow's identity). Verify a download with cosign 3 or newer:
#   sha256sum -c SHA256SUMS --ignore-missing
#   cosign verify-blob SHA256SUMS --bundle SHA256SUMS.sigstore.json \
#     --certificate-identity https://github.com/epic-ai-io/lunchroom/.github/workflows/release.yml@refs/tags/<tag> \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
# Nothing is published unless the whole test suite (test.yml), both builds, the rebuild comparison and every
# system below pass for this commit.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/test.yml
  build:
    # Signing writes the repository's name to Sigstore's public transparency log: release only
    # from a public repository.
    if: ${{ !github.event.repository.private }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo test --release --locked
      - run: rustup target add ${{ matrix.target }}
      # Static (musl): the program depends on no system library, so it runs on any Linux with /proc.
      # Paths are remapped so the build does not depend on where it ran.
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/src --remap-path-prefix=/home/runner/.cargo=/cargo --remap-path-prefix=/home/runner/.rustup=/rustup
      - name: Package
        run: |
          name="lunchroom-${GITHUB_REF_NAME}-${{ matrix.target }}"
          program="target/${{ matrix.target }}/release/lunchroom"
          file "$program" | grep -q "static"
          mkdir -p "dist/$name"
          cp "$program" ../LICENSE ../NOTICE README.md "dist/$name/"
          tar -C dist --sort=name --owner=0 --group=0 --numeric-owner --mtime="@$(git log -1 --format=%ct)" -cf - "$name" | gzip -n > "dist/$name.tar.gz"
      # A second build of the same source in another folder must give the same program, byte for byte.
      - name: Rebuild and compare
        run: |
          mkdir /tmp/again
          tar -C "$GITHUB_WORKSPACE" --exclude=./rust/target --exclude=./rust/dist -cf - . | tar -C /tmp/again -xf -
          cd /tmp/again/rust
          cargo build --release --locked --target ${{ matrix.target }}
          cmp target/${{ matrix.target }}/release/lunchroom "$GITHUB_WORKSPACE/rust/target/${{ matrix.target }}/release/lunchroom"
        env:
          RUSTFLAGS: --remap-path-prefix=/tmp/again=/src --remap-path-prefix=/home/runner/.cargo=/cargo --remap-path-prefix=/home/runner/.rustup=/rustup
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: rust/dist/*.tar.gz
  portability:
    # Each program must start and answer `--version` and `help` with nothing on stderr on every system below,
    # on its own processor type, before anything is published.
    needs: build
    strategy:
      fail-fast: false
      matrix:
        arch:
          - { runner: ubuntu-24.04, target: x86_64-unknown-linux-musl }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
        image:
          - amazonlinux:2
          - amazonlinux:2023
          - ubuntu:20.04
          - ubuntu:22.04
          - ubuntu:24.04
          - debian:12
          - rockylinux/rockylinux:9
          - alpine:3.20
    runs-on: ${{ matrix.arch.runner }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.arch.target }}
          path: dist
      - name: Run on ${{ matrix.image }}
        run: |
          tar -C dist -xzf dist/*.tar.gz
          dir=$(find dist -mindepth 1 -maxdepth 1 -type d)
          docker run --rm -v "$PWD/$dir:/lr:ro" "${{ matrix.image }}" sh -c '
            /lr/lunchroom --version 2>/tmp/err || exit 1
            /lr/lunchroom help >/dev/null 2>>/tmp/err || exit 1
            test ! -s /tmp/err || { cat /tmp/err; exit 1; }'
  publish:
    needs: [checks, build, portability]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - name: Checksums and signature
        working-directory: dist
        run: |
          sha256sum -- *.tar.gz > SHA256SUMS
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
          cosign verify-blob SHA256SUMS --bundle SHA256SUMS.sigstore.json \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          # The same signature checked against another repository's identity must be refused.
          if cosign verify-blob SHA256SUMS --bundle SHA256SUMS.sigstore.json \
            --certificate-identity "https://github.com/someone-else/lunchroom/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com; then exit 1; fi
      - name: Release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        # A draft: the notes are added and the download checked before anyone can see it.
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "Lunchroom $GITHUB_REF_NAME" -- *.tar.gz SHA256SUMS SHA256SUMS.sigstore.json
